name: Trading Bot

on:
  # All scheduled cron jobs disabled — project concluded.
  # schedule:
  #   - cron: '30 14 * * 1'    # Market open execute Monday morning (~9:30 AM ET) - WEEKLY
  #   - cron: '30 21 * * 1-5'  # Daily report (~4:30 PM ET) - keeps daily for portfolio tracking

  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        required: true
        default: 'report'
        type: choice
        options:
          - report
          - dry-run
          - execute
          - status
          - reset
          - manual-buy
env:
  ALPACA_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
  FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  ENABLE_NOTIFICATIONS: 'true'

jobs:
  trading-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check if market is open
        id: market-check
        run: |
          # Skip market check for manual triggers
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          python -c "
          import exchange_calendars as ec
          import datetime
          nyse = ec.get_calendar('XNYS')
          today = datetime.date.today()
          if not nyse.is_session(today):
              print('Market closed today (holiday or weekend)')
              exit(1)
          print(f'Market open today: {today}')
          " && echo "skip=false" >> $GITHUB_OUTPUT || echo "skip=true" >> $GITHUB_OUTPUT

      - name: Determine action based on schedule
        if: steps.market-check.outputs.skip != 'true'
        id: determine-action
        run: |
          # If manually triggered, use the input
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "action=${{ inputs.action }}" >> $GITHUB_OUTPUT
            echo "Manual trigger: ${{ inputs.action }}"
            exit 0
          fi

          # Compute current ET hour to handle DST correctly.
          # Both summer and winter crons fire year-round, so we use the
          # actual ET hour to decide the action and skip duplicates.
          ET_HOUR=$(TZ=America/New_York date +%H)
          UTC_HOUR=$(date -u +%H)
          echo "Current UTC hour: $UTC_HOUR, ET hour: $ET_HOUR"

          # 9 AM ET  = market open  → execute trades
          # 4-5 PM ET = market close → daily report (5 PM in summer due to fixed UTC cron)
          if [ "$ET_HOUR" -eq 9 ] || [ "$ET_HOUR" -eq 10 ]; then
            echo "action=execute" >> $GITHUB_OUTPUT
            echo "Scheduled: Market open - running execute"
          elif [ "$ET_HOUR" -eq 16 ] || [ "$ET_HOUR" -eq 17 ]; then
            echo "action=report" >> $GITHUB_OUTPUT
            echo "Scheduled: Market close - sending daily report"
          else
            echo "Scheduled: ET hour $ET_HOUR does not match any action window — skipping"
            echo "action=skip" >> $GITHUB_OUTPUT
          fi

      - name: Run status check
        if: steps.market-check.outputs.skip != 'true' && steps.determine-action.outputs.action == 'status'
        run: python main.py --status

      - name: Dry run (no trades)
        if: steps.market-check.outputs.skip != 'true' && steps.determine-action.outputs.action == 'dry-run'
        run: python main.py --dry-run

      - name: Execute trades (LIVE)
        if: steps.market-check.outputs.skip != 'true' && steps.determine-action.outputs.action == 'execute'
        run: python main.py

      - name: Send daily report
        if: steps.market-check.outputs.skip != 'true' && steps.determine-action.outputs.action == 'report'
        run: python main.py --report

      - name: Reset account (wipe clean)
        if: steps.market-check.outputs.skip != 'true' && steps.determine-action.outputs.action == 'reset'
        run: python main.py --reset

      - name: Manual buy (one-time)
        if: steps.market-check.outputs.skip != 'true' && steps.determine-action.outputs.action == 'manual-buy'
        run: python main.py --manual-buy

