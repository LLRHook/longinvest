name: Portfolio Reporter

on:
  schedule:
    - cron: '30 21 * * 1-5'  # Daily report (~4:30 PM ET)

  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        required: true
        default: 'report'
        type: choice
        options:
          - report
          - status
          - dry-run
          - monitor

env:
  ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
  FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  FINSCAN_API_KEY: ${{ secrets.FINSCAN_API_KEY }}
  ENABLE_NOTIFICATIONS: 'true'

jobs:
  trading-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check if market is open
        id: market-check
        run: |
          # Skip market check for manual triggers
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          python -c "
          import exchange_calendars as ec
          import datetime
          nyse = ec.get_calendar('XNYS')
          today = datetime.date.today()
          if not nyse.is_session(today):
              print('Market closed today (holiday or weekend)')
              exit(1)
          print(f'Market open today: {today}')
          " && echo "skip=false" >> $GITHUB_OUTPUT || echo "skip=true" >> $GITHUB_OUTPUT

      - name: Determine action based on schedule
        if: steps.market-check.outputs.skip != 'true'
        id: determine-action
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "action=${{ inputs.action }}" >> $GITHUB_OUTPUT
            echo "Manual trigger: ${{ inputs.action }}"
          else
            echo "action=report" >> $GITHUB_OUTPUT
            echo "Scheduled: sending daily report"
          fi

      - name: Run status check
        if: steps.market-check.outputs.skip != 'true' && steps.determine-action.outputs.action == 'status'
        run: python main.py --status

      - name: Dry run (no trades)
        if: steps.market-check.outputs.skip != 'true' && steps.determine-action.outputs.action == 'dry-run'
        run: python main.py --dry-run

      - name: Send daily report
        if: steps.market-check.outputs.skip != 'true' && steps.determine-action.outputs.action == 'report'
        run: python main.py --report

      - name: FinScan portfolio monitor
        if: steps.market-check.outputs.skip != 'true' && steps.determine-action.outputs.action == 'monitor'
        run: python main.py --monitor
